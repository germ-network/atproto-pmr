# Example configuration for a Worker consuming this package.
#
# This package is not itself a deployable Worker — it supplies the Durable
# Object class and the storage adapters. Copy this into YOUR Worker and fill
# in your own values.
#
# Deliberately absent: `account_id` (wrangler infers it from your login, and
# a wrong one is expensive), and any `routes` block (routing is a deployment
# decision, and a Worker runs on workers.dev without one).

name = "my-atproto-pmr"
main = "src/index.ts"
compatibility_date = "2026-07-01"

# Your entry point MUST re-export the Durable Object class, because wrangler
# looks for it on `main`:
#
#     export { PMRObject } from "@germ-network/atproto-pmr-cloudflare"
#
# To supply your own synthetic behavior — which you should — subclass it and
# export the subclass under the name used here instead.
[durable_objects]
bindings = [
  { name = "pmrs", class_name = "PMRObject" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PMRObject"]

# ─────────────────────────────────────────────────────────────────────────
# All values below are IMPLEMENTATION-DEFINED. The specification fixes none
# of them; these are illustrative round numbers, not a recommendation. See
# `spec/wire-api.md`, "Limits are implementation-defined", for the reasoning
# that does transfer.
# ─────────────────────────────────────────────────────────────────────────
[vars]
# The host this relay serves. A protocol input (grant address derivation is
# domain-separated by it), not routing — and also the additional
# authenticated data a Web Push seal binds (below), so it must match what a
# device already resolves for a given key_id.
HOST_NAME = "my-relay.example"

# active | draining | absent. `draining` stops vending new grants while
# still accepting puts to already-vended addresses, which is how grant
# issuance is retired without stranding mail peers hold addresses for.
#
# There is no companion setting for the mailboxes themselves: a relay
# operates both kinds or is not a relay (see spec/wire-api.md). Grants are
# the one thing vended to third parties, so they are the one thing whose
# retirement a peer can observe.
GRANT_LIFECYCLE = "active"

# Per-sender capacity of a provisioned pair mailbox. The mailbox refuses at
# this point rather than evicting.
MAX_MESSAGES_PER_PAIR_SENDER = "25"

# Recovery pool. Bounded by BYTES, never by sender count: width is the
# property the pool exists to provide, so under pressure depth gives and
# width holds.
POOL_CAP_BYTES = "4000000"
POOL_DEPTH_PER_SENDER = "3"
POOL_DEPTH_UNDER_PRESSURE = "1"

# Web Push delegation (spec/wire-api.md, "Push delivery — Web Push"). Set
# ALL FIVE of these together ONLY if this deployment cannot reach a push
# service itself and delivers via a subscription the device mints for it —
# partial configuration is treated as none, and a relay with its own push
# path leaves all five unset and publishes no vapidKey at all.
#
# VAPID_PUBLIC_KEY: base64url, unpadded — the 65-byte uncompressed P-256
# point (0x04 ‖ X ‖ Y) that a device passes to its push service as the
# applicationServerKey.
# VAPID_PUBLIC_KEY = "BEl6...87 chars total"
#
# VAPID_PRIVATE_KEY: a SECRET, never a var — the raw 32-byte P-256 scalar,
# base64url, that signs each delivery's authorizing JWT. Generate the
# keypair and set the private half with:
#   npx wrangler secret put VAPID_PRIVATE_KEY
#
# VAPID_SUBJECT: a mailto: or https: contact (RFC 8292 §2.1) some push
# services require.
# VAPID_SUBJECT = "mailto:ops@my-relay.example"
#
# PUSH_MAX_SEALED_BYTES: the push service's payload ceiling, in bytes,
# including the seal's fixed overhead — push-service-specific, not a
# protocol constant. A sender the relay itself does not operate (a browser
# push service, a UnifiedPush distributor) may have a different ceiling
# than this example's.
# PUSH_MAX_SEALED_BYTES = "2880"
#
# PUSH_TTL_SECONDS: RFC 8030 TTL sent with every delivery.
# PUSH_TTL_SECONDS = "86400"

# KV namespace ids are placeholders. Create your own:
#   npx wrangler kv namespace create <binding>
[[kv_namespaces]]
	binding = "pmrDirectory"
	id = "REPLACE_WITH_YOUR_NAMESPACE_ID"
[[kv_namespaces]]
	binding = "addresses"
	id = "REPLACE_WITH_YOUR_NAMESPACE_ID"
[[kv_namespaces]]
	binding = "messages"
	id = "REPLACE_WITH_YOUR_NAMESPACE_ID"
[[kv_namespaces]]
	binding = "challenges"
	id = "REPLACE_WITH_YOUR_NAMESPACE_ID"
