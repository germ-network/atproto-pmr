# Test-only configuration. This package is a library, not a deployable
# Worker, so tests need an entry point that re-exports the Durable Object
# class for wrangler to find.
name = "atproto-pmr-monitor-cloudflare-tests"
main = "test/worker.ts"
compatibility_date = "2026-07-01"

[durable_objects]
# `ingestRegistered` is the same object under the `registered` policy; the
# rest of the suites run under `everyone`, as the existing deployment does.
bindings = [
	{ name = "ingest", class_name = "MonitorIngest" },
	{ name = "ingestRegistered", class_name = "RegisteredMonitorIngest" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MonitorIngest"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RegisteredMonitorIngest"]

# Illustrative values, matching wrangler.example.toml. All are
# implementation-defined; tests read them from env rather than hardcoding.
[vars]
MONITOR_COLLECTION = "com.germnetwork.declaration"
MONITOR_COLLECTIONS = "app.bsky.actor.profile/self"
INTEREST_POLICY = "everyone"
JETSTREAM_URL = "https://jetstream.invalid/subscribe"
PLC_EXPORT_STREAM_URL = "https://plc.invalid/export/stream"
WATCHDOG_INTERVAL_MS = "120000"
SETTLE_BATCH = "32"
# Changing this requires clearing sealed windows + sealedThrough: an
# absent window below sealedThrough means "empty", and that promise does
# not survive a granularity change.
DIGEST_WINDOW_MS = "600000"
# Tune from observed response sizes; a byte budget rather than a window
# count so it does not go stale as the population grows.
DIGEST_BYTE_BUDGET = "65536"
# Free to retune: every window carries the parameters it was sealed under.
DIGEST_FALSE_POSITIVE_RATE = "0.01"

# Records never expire; digest windows do.
WINDOW_RETENTION_SECONDS = "604800"

# Tier 3's baseline build: how a DID published before this monitor's
# connection opened, and never touched since, still gets discovered.
BACKFILL_RELAY_URL = "https://relay.invalid"
BACKFILL_BATCH = "100"

# Snapshot refresh: how many held snapshots each alarm re-confirms, and how
# stale one must be to be due. Past the relay's 24 h bound a lapsed snapshot is
# checked against the sender's PDS on puts naming it; these keep that rare.
REFRESH_BATCH = "64"
REFRESH_STALE_AFTER_MS = "3600000"

# The follow-edge index's listings and re-list triggers.
FOLLOW_BACKFILL_REPOS = "4"
FOLLOW_LISTING_STATEMENT_RESERVE = "400"
MAX_FOLLOWS = "20000"
FOLLOW_MAX_REPO_BYTES = "33554432"
FOLLOW_FETCH_TIMEOUT_MS = "30000"
JETSTREAM_LOOKBACK_MS = "129600000"
FOLLOW_RELIST_AFTER_MS = "604800000"

[[kv_namespaces]]
	binding = "records"
	id = "test"

[[kv_namespaces]]
	binding = "registrations"
	id = "test-registrations"

[[kv_namespaces]]
	binding = "pmrDirectory"
	id = "test-pmr-directory"

[[d1_databases]]
	binding = "graph"
	database_name = "atproto-pmr-graph-test"
	database_id = "test-graph"
	migrations_dir = "migrations"
