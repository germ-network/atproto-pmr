# Illustrative configuration for a key monitor. Nothing here is specified:
# the collection, the stream, and the cadences are all an operator's.

name = "example-key-monitor"
main = "src/worker.ts"
compatibility_date = "2026-07-01"

# THE INGEST OBJECT IS A SINGLETON. Address it by a fixed name — one
# Jetstream stream (and the optional PLC export stream), each with its own
# cursor, and one rev index for the whole coverage. Addressing it per user
# would open sockets per user and interleave writers.
[durable_objects]
bindings = [{ name = "ingest", class_name = "MonitorIngest" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MonitorIngest"]

[vars]
# The collection carrying the published key.
MONITOR_COLLECTION = "com.germnetwork.declaration"

# Who the monitor keeps records for. `registered` (the default) is registered
# users plus the DIDs they follow, and needs the `pmrDirectory` binding below;
# `everyone` is every DID that holds the declaration collection and runs the
# relay backfill. An unknown value fails the object at startup.
INTEREST_POLICY = "registered"
# Optional: singleton records kept beside the declaration for every DID in
# interest, as comma-separated <nsid>/<rkey>. Unset keeps none.
MONITOR_COLLECTIONS = "app.bsky.actor.profile/self"
# DIDs that hold no declaration (followees) are head-checked this often;
# holders use REFRESH_STALE_AFTER_MS.
REFRESH_NONHOLDER_STALE_AFTER_MS = "86400000"
# How long an unregister waits for a re-register before it applies.
UNREGISTER_GRACE_MS = "600000"
# The monitor also holds a second Jetstream socket for follows and the
# MONITOR_COLLECTIONS records, with its own cursor. While it only drops events,
# that cursor (and last_connected_at) is persisted at most this often; a kept
# event persists it at once.
FOLLOW_CURSOR_PERSIST_MS = "5000"

# A monitor is not bound to any one provider. Point this at a self-hosted
# instance to take a third party out of the noticing path; the trust model
# never depended on this feed being honest, only on it being timely.
JETSTREAM_URL = "https://jetstream.us-west.bsky.network/xrpc/network.bsky.jetstream.subscribeEvents"
# Optional. The PLC directory's export stream (the https form of
# wss://plc.directory/export/stream), one socket for both caches: the relay's
# cached did:plc signing keys follow a rotation as soon as it lands, and a
# stored did:plc document follows a change as soon as the directory accepts it
# and is trusted by a relay for 24 h while the stream is caught up. Leave unset
# to rely on the cache TTLs alone (no second socket). Keep it the same directory
# the monitor's fetches and the relay's fallback read.
PLC_EXPORT_STREAM_URL = "https://plc.directory/export/stream"

# An outbound socket does not hibernate, so this object is evicted on the
# platform's schedule whatever this value is. The alarm is what reconnects
# from the stored cursor; eviction is expected, not exceptional.
WATCHDOG_INTERVAL_MS = "120000"

# Owed fetches settled per wake. A failed fetch stays owed with backoff:
# the stream will not redeliver it.
SETTLE_BATCH = "32"
# Changing this requires clearing sealed windows + sealedThrough: an
# absent window below sealedThrough means "empty", and that promise does
# not survive a granularity change.
DIGEST_WINDOW_MS = "600000"
# Tune from observed response sizes; a byte budget rather than a window
# count so it does not go stale as the population grows.
DIGEST_BYTE_BUDGET = "65536"
# Free to retune: every window carries the parameters it was sealed under.
DIGEST_FALSE_POSITIVE_RATE = "0.01"

# Records never expire; digest windows do.
WINDOW_RETENTION_SECONDS = "604800"

# Tier 3's baseline build (spec/key-transparency.md, "Keeping the snapshot current"): how a
# DID published before this monitor's connection opened, and never
# touched since, still gets discovered. The live tail alone cannot see it.
BACKFILL_RELAY_URL = "https://relay1.us-west.bsky.network"
BACKFILL_BATCH = "100"

# Snapshot refresh: how many held snapshots each alarm re-confirms, and how
# stale one must be to be due. Past the relay's 24 h bound a lapsed snapshot is
# checked against the sender's PDS on puts naming it; these keep that rare.
REFRESH_BATCH = "64"
REFRESH_STALE_AFTER_MS = "3600000"

# The follow-edge index: getRepo listings fetched per alarm (one at a time), the D1
# statements they may take per alarm out of GRAPH_STATEMENT_BUDGET, the record
# count and repo size past which an owner is listed by listRecords pages
# instead of one verified getRepo, and the getRepo bound. Raise
# FOLLOW_MAX_REPO_BYTES only on a measured heap: the verifying walk shares the
# isolate's 128 MB with the sockets. A follow stream down longer than
# Jetstream's replay window re-lists everyone; any listing older than the
# re-list interval runs again.
FOLLOW_BACKFILL_REPOS = "4"
FOLLOW_LISTING_STATEMENT_RESERVE = "400"
MAX_FOLLOWS = "20000"
MAX_BLOCKS = "20000"
FOLLOW_MAX_REPO_BYTES = "33554432"
FOLLOW_FETCH_TIMEOUT_MS = "30000"
JETSTREAM_LOOKBACK_MS = "129600000"
FOLLOW_RELIST_AFTER_MS = "604800000"

# The relay's directory of registered DIDs (bare <did> keys), read only: the
# daily reconcile lists it to repair a missed register or unregister. Required
# under INTEREST_POLICY = "registered"; optional under "everyone".
[[kv_namespaces]]
	binding = "pmrDirectory"
	id = "PROVISION_BEFORE_DEPLOY"

# The snapshot and sealed digest windows. Read by plain Workers on the
# public paths — the community view should scale like the public data it
# is, rather than funnel through the ingest object.
[[kv_namespaces]]
	binding = "records"
	id = "PROVISION_BEFORE_DEPLOY"

# Optional: the registration surface (own-DID push). Omit this binding
# entirely to run a monitor with no registration/push capability — the
# registration endpoints then have nothing to serve, and `onChange` no-ops.
# Deliberately its own namespace, not the relay's registration storage: see
# `MonitorRegistration`'s doc comment (`@germ-network/atproto-pmr-monitor`)
# for why a registration must outlive a co-hosted relay registration.
[[kv_namespaces]]
	binding = "registrations"
	id = "PROVISION_BEFORE_DEPLOY"

# The follow-edge index, written only by MonitorIngest and read by its owner
# graph and block RPCs and, through `d1InterestReader`, by read routes.
# Required: the object fails at startup without it. Apply the
# migrations before deploying. migrations_dir is relative to this file; from
# the npm package, point it at
# node_modules/@germ-network/atproto-pmr-monitor-cloudflare/migrations.
[[d1_databases]]
	binding = "graph"
	database_name = "atproto-pmr-graph"
	database_id = "PROVISION_BEFORE_DEPLOY"
	migrations_dir = "migrations"
