name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.ref == 'refs/heads/main' && github.repository_owner == 'germ-network' }}
    name: Release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pull-requests: write
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          check-latest: true
          cache: pnpm

      # NOTE: `publish:` is deliberately absent. With it set, this action
      # attempts an npm publish on every push to main whenever there are no
      # pending changesets — and since this job grants `id-token: write`,
      # npm trusted publishing would succeed with no NPM_TOKEN configured.
      # These packages are distributed as git dependencies today, not npm.
      #
      # Without `publish`, this step only opens a "Prepare next release" PR
      # when changesets are present; `createGithubReleases` is inert until a
      # publish runs, so the actual release tag is created by the next step.
      #
      # To enable npm publishing later: add `publish: pnpm release`, add a
      # `release` script (`changeset publish`) to the root package.json,
      # drop `"private": true` from the two packages, and set `access` to
      # "public" in .changeset/config.json.
      - name: Create Pull Request for next release
        id: changesets
        uses: changesets/action@v1

        with:
          title: Prepare next release
          createGithubReleases: true
          version: pnpm version-package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A single, uniform repo tag `v<version>` per release. These packages are
      # consumed as git dependencies pinned to a commit, so the meaningful
      # release artifact is one tag over the whole repo, not per-package tags —
      # `fixed` versioning (.changeset/config.json) keeps all packages on that
      # one version, read here from `core`. Runs whenever no changesets remain
      # (i.e. just after a "Prepare next release" PR merged, and on ordinary
      # pushes), and is idempotent: it does nothing when the tag already
      # exists, so only a genuine version bump creates a tag. A tag push does
      # not re-trigger this workflow (it listens on `main` pushes only).
      - name: Tag uniform release
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          VERSION="$(node -p "require('./packages/core/package.json').version")"
          TAG="v${VERSION}"
          git fetch --tags --quiet
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "${TAG} already exists — nothing to tag."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "atproto-pmr ${TAG}"
            git push origin "${TAG}"
            echo "Tagged ${TAG}."
          fi
